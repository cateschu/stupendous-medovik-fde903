.adminbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:9px;font-size:13px}
.adminbar .wrap span{margin-right:auto}
.adminbar .btn{background:var(--sage);color:var(--ink)}
.adminbar .btn.ghost{background:transparent;color:var(--surface);border-color:rgba(255,255,255,.35)}
.edit-tools{display:flex;gap:6px;padding:0 16px 14px}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(48,54,43,.4)}
.modal .box{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:calc(100% - 20px);overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .prev{width:96px;height:96px;border-radius:12px;object-fit:cover;background:var(--beige)}
.warnbox{background:#F6E7D8;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:24px;padding-block:28px 18px}
  .hero figure{order:-1}
  .custom{grid-template-columns:1fr;padding:20px}
  .custom form,.modal .two{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  .card .body{padding:12px}
  .top .wrap .btn.ghost{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    h += '<label class="field">Mayorista: descuentos (cantidad:porcentaje, separados por coma)<input id="s-tiers" value="'+esc(tiers().map(function(t){return t[0]+":"+t[1];}).join(", "))+'"></label>';
    h += '<label class="field">Mayorista: texto de la sección<textarea id="s-mayor">'+esc(S.mayor&&S.mayor.text||"")+'</textarea></label>';
    h += '<label class="field">Usuario de Instagram<input id="s-ig" value="'+esc(S.instagram)+'"></label>';
    h += '<label class="field">Cambiar logo<input id="s-logo" type="file" accept="image/*"></label>';
  } else {
    var p = e.p;
    h += '<h3>'+(e.isNew?"Nuevo producto":"Editar producto")+'</h3>';
    h += '<div style="display:flex;gap:14px;align-items:center">'+(p.img?'<img class="prev" src="'+esc(p.img)+'" alt="">':'<div class="prev"></div>')+'<div style="flex:1;display:flex;flex-direction:column;gap:8px"><label class="field">Foto<input id="e-img" type="file" accept="image/*"></label><label class="field" style="flex-direction:row;align-items:center;gap:8px"><input id="e-ref" type="checkbox" style="width:auto"'+(p.ref?" checked":"")+'> Es foto de referencia (no la saqué yo)</label></div></div>';
    h += '<div class="field">Texto para crear la foto con IA<textarea id="e-prompt" readonly rows="4">'+esc(aiPrompt(p))+'</textarea><button class="btn small ghost" type="button" data-a="copy-prompt" style="align-self:flex-start">Copiar texto</button></div>';
    h += '<label class="field">Nombre<input id="e-name" value="'+esc(p.name)+'" placeholder="Ej: Maceta Ondas"></label>';
    h += '<label class="field">Descripción<textarea id="e-desc">'+esc(p.desc)+'</textarea></label>';
    h += '<div class="two"><label class="field">Sección<select id="e-type">'+Object.keys(TYPES).map(function(k){return '<option value="'+k+'"'+(p.type===k?" selected":"")+'>'+TYPES[k]+'</option>';}).join("")+'</select></label>';
    h += '<label class="field">Precio (en pesos)<input id="e-price" type="number" min="0" step="100" value="'+esc(p.price)+'"></label>';
    h += '<label class="field">Unidades en stock<input id="e-stock" type="number" min="0" value="'+esc(p.stock)+'"></label>';
    h += '<label class="field">Demora (encargo y personalizado)<input id="e-days" value="'+esc(p.days)+'" placeholder="Ej: 5 a 7 días"></label></div>';
    var k=calc(p);
    h += '<div class="three"><label class="field">Gramos de filamento<input id="e-grams" type="number" min="0" value="'+esc(p.grams||0)+'"></label><label class="field">Horas de impresión<input id="e-hours" type="number" min="0" step="0.5" value="'+esc(p.hours||0)+'"></label><label class="field">Insumos extra en $ (clickers, argollas, imanes, LED, tarugos…)<input id="e-extras" type="number" min="0" step="100" value="'+esc(p.extras||0)+'"></label></div>';
    h += '<div class="warnbox" style="background:var(--sage-soft);color:var(--ink)" id="e-calc">'+calcLine(k)+'</div>';
    h += '<label class="field">Colores solo para este producto (vacío = todos los disponibles)<input id="e-colors" value="'+esc((p.colors||[]).join(", "))+'" placeholder="'+esc((S.colors||[]).join(", "))+'"></label>';
    h += '<div class="two"><label class="field">Categoría<input id="e-cat" list="cat-list" value="'+esc(p.cat||"")+'" placeholder="Deco, Plantas, Navidad…"><datalist id="cat-list">'+["Deco","Plantas","Organización","Fidget y juguetes","Regalos","Navidad","Halloween"].map(function(c){return '<option value="'+c+'">';}).join("")+'</datalist></label><label class="field" style="flex-direction:row;align-items:center;gap:8px;margin-top:22px"><input id="e-trend" type="checkbox" style="width:auto"'+(p.trend?" checked":"")+'> Marcar como "En tendencia"</label></div>';
    h += '<label class="field" style="flex-direction:row;align-items:center;gap:8px"><input id="e-sizes" type="checkbox" style="width:auto"'+(p.sizes?" checked":"")+'> Ofrecer tamaños chico, mediano y grande (el precio de arriba es el del mediano)</label>';
    h += '<label class="field">Qué escribe el cliente (solo personalizados)<input id="e-custom" value="'+esc(p.custom)+'" placeholder="Ej: Inicial o nombre"></label>';
    if(!e.isNew) h += '<div id="del-zone">'+(e.confirmDel?'<div class="warnbox">¿Seguro? Se quita de la tienda cuando publiques. <button class="btn small" data-a="del-yes">Sí, quitar</button> <button class="btn small ghost" data-a="del-no">No</button></div>':'<button class="btn small ghost" data-a="del">Quitar producto</button>')+'</div>';
  }
  h += '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px"><button class="btn ghost" data-a="cancel">Cancelar</button><button class="btn" data-a="save">Guardar</button></div>';
  return h + '</div></div>';
}

/* ---------- actions ---------- */
function zoomAt(z,ev){var r=z.getBoundingClientRect(),im=z.querySelector("img");if(!im)return;var x=((ev.clientX-r.left)/r.width)*100,y=((ev.clientY-r.top)/r.height)*100;im.style.transformOrigin=Math.max(0,Math.min(100,x))+"% "+Math.max(0,Math.min(100,y))+"%";}
app.addEventListener("pointermove",function(ev){var z=ev.target.closest&&ev.target.closest(".zoom.on");if(z)zoomAt(z,ev);});
function toast(msg){var el=document.getElementById("cr-toast");if(!el){el=document.createElement("div");el.id="cr-toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true;},2400);}
function val(id){var el=document.getElementById(id);return el?el.value.trim():"";}
function readOrderFields(){if(document.getElementById("o-name")){state.oName=val("o-name");state.oDeliv=val("o-deliv");state.oNote=val("o-note");}}

function shrink(file,max,cb){
  var r = new FileReader();
  r.onload = function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height));var c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.8));};im.onerror=function(){toast("No se pudo leer esa imagen.");};im.src=r.result;};
  r.readAsDataURL(file);
}

app.addEventListener("click",function(ev){
  var z = ev.target.closest("[data-zoom]");
  if(z){ if(z.querySelector("img")){ z.classList.toggle("on"); zoomAt(z,ev); } return; }
  var t = ev.target.closest("[data-a]"); if(!t) return;
  var a = t.dataset.a, id = t.dataset.id;
  if(a==="view"){state.view=id;render();return;}
  if(a==="close-view"){ if(t.classList.contains("modal")&&ev.target!==t) return; state.view=null;render();return;}
  if(a==="ask"){var ap=prod(id),acol=state.sel[id]||pcolors(ap)[0]||"",asz=ap.sizes?(state.sz[id]||"Mediano"):"";var am="Hola Crealia! Tengo una consulta sobre: "+ap.name+(acol?" (color "+acol.toLowerCase()+(asz?", tamaño "+asz.toLowerCase():"")+")":"")+".";var aa=document.createElement("a");aa.href=waLink(am);aa.target="_blank";aa.rel="noopener";document.body.appendChild(aa);aa.click();aa.remove();toast("Abriendo WhatsApp…");return;}
  if(a==="txt") return;
  if(a==="wq") return;
  if(a==="wsend"){
    var wp=prod(id), wqv=Math.max(tiers()[0][0],parseInt(state.wq[id]||tiers()[0][0],10)), wc=state.sel[id]||pcolors(wp)[0]||"", wtx=state.txt[id]||"";
    var wm="Hola Crealia! Pedido mayorista:\n"+wqv+"x "+wp.name+(wc?" "+wc.toLowerCase():"")+(wtx?" \""+wtx+"\"":"")+"\nMe pasás precio y demora?";
    var wa=document.createElement("a");wa.href=waLink(wm);wa.target="_blank";wa.rel="noopener";document.body.appendChild(wa);wa.click();wa.remove();toast("Abriendo WhatsApp…");return;
  }
  if(a==="size"){state.sz[id]=t.dataset.v;render();return;}
  if(a==="var"){state.vr=state.vr||{};state.vr[id]=+t.dataset.v;render();return;}
  if(a==="addon"){state.ad=state.ad||{};state.ad[id]=!state.ad[id];render();return;}
  if(a==="cat"){state.cat[t.dataset.t]=t.dataset.v;render();return;}
  if(a==="fclear"){state.q="";state.pmax=0;state.sort="";render();return;}
  if(a==="color"){state.sel[id]=t.dataset.v;render();return;}
  if(a==="add"){
    var p = prod(id), color = state.sel[id] || pcolors(p)[0] || "", text = state.txt[id] || "";
    if(p.type==="personalizado" && !text){toast("Escribí el texto a personalizar.");var f=document.getElementById("txt-"+id);if(f)f.focus();return;}
    var size = p.sizes ? (state.sz[id]||"Mediano") : "";
    var vv = Math.max(0,vIdx(p)), aa = aOn(p);
    var ex = state.cart.filter(function(l){return l.id===id&&l.color===color&&(l.text||"")===text&&(l.size||"")===size&&(l.v||0)===vv&&!!l.a===aa;})[0];
    var inCart = state.cart.filter(function(l){return l.id===id;}).reduce(function(s,l){return s+l.qty;},0);
    if(p.type==="stock" && inCart>=p.stock){toast("No hay más unidades en stock.");return;}
    if(ex) ex.qty++; else state.cart.push({id:id,color:color,text:text,size:size,v:vv,a:aa,qty:1});
    saveCart(); render(); toast(p.name+" agregado al carrito"); return;
  }
  if(a==="open-cart"){state.open=true;render();return;}
  if(a==="close-cart"){readOrderFields();state.open=false;render();return;}
  if(a==="plus"||a==="minus"){
    readOrderFields();
    var lines=validCart(), l=lines[+t.dataset.i]; if(!l) return;
    if(a==="plus"){var pp=prod(l.id);var tot=state.cart.filter(function(x){return x.id===l.id;}).reduce(function(s,x){return s+x.qty;},0);if(pp.type==="stock"&&tot>=pp.stock){toast("No hay más unidades en stock.");return;}l.qty++;}
    else{l.qty--; if(l.qty<=0) state.cart.splice(state.cart.indexOf(l),1);}
    saveCart();render();return;
  }
  if(a==="toggle-edit"){state.editMode=!state.editMode;render();return;}
  if(a==="new"){state.edit={kind:"product",isNew:true,p:{id:uid(),type:"stock",name:"",desc:"",price:0,stock:1,days:"",colors:[],custom:"",img:"",sizes:false,grams:0,hours:0,extras:0}};render();return;}
  if(a==="edit"){state.edit={kind:"product",p:JSON.parse(JSON.stringify(prod(id)))};render();return;}
  if(a==="settings"){state.edit={kind:"settings",logo:S.logo};render();return;}
  if(a==="cancel"){state.edit=null;render();return;}
  if(a==="del"){captureEdit();state.edit.confirmDel=true;render();return;}
  if(a==="del-no"){captureEdit();state.edit.confirmDel=false;render();return;}
  if(a==="del-yes"){P.splice(P.indexOf(prod(state.edit.p.id)),1);state.edit=null;state.dirty=true;render();toast("Producto quitado. Falta publicar.");return;}
  if(a==="up"||a==="down"){
    var i=P.indexOf(prod(id)), dir=a==="up"?-1:1, j=i+dir;
    while(j>=0&&j<P.length&&P[j].type!==P[i].type) j+=dir;
    if(j<0||j>=P.length) return;
    var tmp=P[i];P[i]=P[j];P[j]=tmp;state.dirty=true;render();return;
  }
  if(a==="save"){
    if(state.edit.kind==="settings"){
      var wa=val("s-wa").replace(/\D/g,"");
      if(wa.length<10){toast("Revisá el número de WhatsApp: tiene que tener el código de país.");return;}
      S.whatsapp=wa;S.tagline=val("s-tag")||S.tagline;S.intro=val("s-intro");S.encargoNote=val("s-enc");S.envios=val("s-env");S.instagram=val("s-ig").replace(/^@/,"");
      var spl=function(v){return v.split(",").map(function(s){return s.trim();}).filter(Boolean);};S.colors=spl(val("s-colors"));S.colorsSoon=spl(val("s-soon"));
      var tl=spl(val("s-tiers")).map(function(x){var q=x.split(":");return [parseInt(q[0],10),parseFloat(q[1])];}).filter(function(x){return x[0]>0&&x[1]>=0;});
      S.mayor=S.mayor||{};if(tl.length)S.mayor.tiers=tl;S.mayor.text=val("s-mayor");
      if(state.edit.logo) S.logo=state.edit.logo;
    } else {
      captureEdit();
      var np=state.edit.p;
      if(!np.name){toast("Ponele un nombre al producto.");return;}
      var old=prod(np.id); if(old) P[P.indexOf(old)]=np; else P.push(np);
    }
    state.edit=null;state.dirty=true;render();toast("Guardado. Tocá Publicar cambios para que lo vean todos.");return;
  }
  if(a==="photos"){state.edit={kind:"photos"};render();return;}
  if(a==="copy-pp"){var ta=document.getElementById("pp-"+id);copyText(ta.value,ta);return;}
  if(a==="copy-prompt"){captureEdit();var tp=document.getElementById("e-prompt");tp.value=aiPrompt(state.edit.p);copyText(tp.value,tp);return;}
  if(a==="costs"){state.edit={kind:"costs"};render();return;}
  if(a==="use-price"){captureEdit();var k=calc(state.edit.p);state.edit.p.price=k.price;render();return;}
  if(a==="apply-prices"){var n=0;P.forEach(function(p){if(p.type!=="stock"){var k=calc(p);if(k.has&&p.price!==k.price){p.price=k.price;n++;}}});if(n)state.dirty=true;render();toast(n?n+" precios actualizados. Falta publicar.":"Los precios ya están al día.");return;}
  if(a==="publish"){publish(t);return;}
});

function captureEdit(){
  var p=state.edit&&state.edit.p; if(!p||!document.getElementById("e-name")) return;
  p.name=val("e-name");p.desc=val("e-desc");p.type=val("e-type");p.price=Math.max(0,Number(val("e-price"))||0);
  p.stock=Math.max(0,parseInt(val("e-stock"),10)||0);p.days=val("e-days");p.custom=val("e-custom");
  p.cat=val("e-cat");if(document.getElementById("e-sizes"))p.sizes=document.getElementById("e-sizes").checked;if(document.getElementById("e-ref"))p.ref=document.getElementById("e-ref").checked;p.trend=!!(document.getElementById("e-trend")||{}).checked;p.grams=Math.max(0,Number(val("e-grams"))||0);p.hours=Math.max(0,Number(val("e-hours"))||0);p.extras=Math.max(0,Number(val("e-extras"))||0);
  p.colors=val("e-colors").split(",").map(function(s){return s.trim();}).filter(Boolean);
}

app.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="o-cp"){state.oCP=t.value.trim();var pos2=t.selectionStart,db=document.querySelector(".drawer"),dbs=db?db.scrollTop:0;readOrderFields();render();var nd=document.querySelector(".drawer");if(nd)nd.scrollTop=dbs;var ci=document.getElementById("o-cp");if(ci){ci.focus();try{ci.setSelectionRange(pos2,pos2);}catch(e){}}return;}
  if(t.id==="f-q"){state.q=t.value;var pos=t.selectionStart,sc=window.scrollY;render();var ni=document.getElementById("f-q");if(ni){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(e){}}window.scrollTo(0,sc);return;}
  if(t.dataset.a==="txt") state.txt[t.dataset.id]=t.value.trim();
  if(t.dataset.a==="wq"){var qq=parseInt(t.value,10)||0;state.wq[t.dataset.id]=qq;}
  if(t.id==="e-grams"||t.id==="e-hours"||t.id==="e-extras"){captureEdit();var ec=document.getElementById("e-calc");if(ec)ec.innerHTML=calcLine(calc(state.edit.p));}
  if(t.id&&t.id.indexOf("k-")===0){var v=Number(t.value);if(t.value!==""&&!isNaN(v)){costs()[t.id.slice(2)]=v;state.dirty=true;var sc=window.scrollY,box=document.querySelector(".modal .box"),bs=box?box.scrollTop:0,fid=t.id,pos=t.selectionStart;render();var nb=document.querySelector(".modal .box");if(nb)nb.scrollTop=bs;var ni=document.getElementById(fid);if(ni){ni.focus();}}}
  if(t.id==="o-name"||t.id==="o-note"||t.id==="o-deliv"){readOrderFields();var w=document.getElementById("wa-send");if(w)w.href=waLink(orderText());}
});
app.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="f-sort"){state.sort=t.value;var sc=window.scrollY;render();window.scrollTo(0,sc);return;}
  if(t.id==="f-pmax"){state.pmax=Number(t.value)||0;var sc2=window.scrollY;render();window.scrollTo(0,sc2);return;}
  if(t.id==="o-deliv"){readOrderFields();var db=document.querySelector(".drawer .body, .drawer"),dbs=db?db.scrollTop:0;render();var nd=document.querySelector(".drawer .body, .drawer");if(nd)nd.scrollTop=dbs;return;}
  if(t.dataset&&t.dataset.a==="pp-up"&&t.files[0]){var pid=t.dataset.id;shrink(t.files[0],720,function(d){var pr=prod(pid);if(pr){pr.img=d;pr.ref=false;state.dirty=true;var box=document.querySelector(".modal .box"),bs=box?box.scrollTop:0;render();var nb=document.querySelector(".modal .box");if(nb)nb.scrollTop=bs;toast("Foto cargada: "+pr.name);}});}
  if(t.id==="e-img"&&t.files[0]){captureEdit();shrink(t.files[0],560,function(d){state.edit.p.img=d;render();});}
  if(t.id==="s-logo"&&t.files[0]){shrink(t.files[0],900,function(d){state.edit.logo=d;toast("Logo listo. Tocá Guardar.");});}
});
app.addEventListener("submit",function(ev){
  if(ev.target.id!=="custom-form") return;
  ev.preventDefault();
  var idea=val("c-idea"); if(!idea){toast("Contanos tu idea primero.");return;}
  var msg="Hola Crealia! Quiero un personalizado: "+idea;
  var extra=[val("c-size"),val("c-color"),val("c-when")?"para "+val("c-when"):"",val("c-name")].filter(Boolean);
  if(extra.length) msg+="\n"+extra.join(" · ");
  var a=document.createElement("a");a.href=waLink(msg);a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
  toast("Abriendo WhatsApp…");
});

/* ---------- publish (regenerates the whole page from its data) ---------- */
function buildDocument(){
  var reset = (document.head.querySelector("style")||{}).textContent || ":root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  var css = document.getElementById("cr-style").textContent;
  var js = document.getElementById("cr-js").textContent;
  var data = JSON.stringify(DATA).replace(/</g,"\\u003c");
  var SC = "<"+"/script>", ST = "<"+"/style>";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+ST+'</head><body>'
    + '<title>Crealia</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">\n'
    + '<style id="cr-style">'+css+ST+'\n<div id="app"></div>\n'
    + '<script type="application/json" id="cr-data">'+data+SC+'\n'
    + '<script id="cr-js">'+js+SC+'</body></html>';
}
function publish(btn){
  if(!artifactApi){toast("No se puede publicar desde esta vista.");return;}
  btn.disabled=true;btn.textContent="Publicando…";
  try{sessionStorage.setItem("crealia-admin","1");}catch(e){}
  artifactApi.publish(buildDocument()).then(function(){
    state.dirty=false;render();toast("Publicado. Ya lo ve todo el mundo.");
  },function(err){
    var c=err&&err.code;
    if(c==="conflict") toast("Había una versión más nueva. Se recarga la tienda.");
    else if(c==="not_writer"||c==="not_granted"){canEdit=false;state.admin=false;state.editMode=false;render();toast("Esta vista es solo de lectura.");}
    else if(c==="too_large") toast("La tienda quedó muy pesada. Probá con fotos más livianas.");
    else if(c==="rate_limited") toast("Esperá un momento antes de volver a publicar.");
    else toast("No se pudo publicar. Probá de nuevo en un rato.");
    btn.disabled=false;btn.textContent="Publicar cambios";
  });
}

render();

if(window.claude&&window.claude.use){
  Promise.all([window.claude.use("user").catch(function(){return null;}),window.claude.use("artifact").catch(function(){return null;})]).then(function(r){
    var user=r[0]; artifactApi=r[1];
    return user&&artifactApi ? user.canEdit() : false;
  }).then(function(ok){
    canEdit=!!ok;
    if(canEdit){
      state.admin=true;
      var back=false;try{back=sessionStorage.getItem("crealia-admin")==="1";sessionStorage.removeItem("crealia-admin");}catch(e){}
      state.editMode=back || waNumber()===PLACEHOLDER;
      render();
    }
  }).catch(function(){});
}
window.addEventListener("keydown",function(e){if(e.key==="Escape"&&state.view&&!state.open&&!state.edit){state.view=null;render();return;}if(e.key==="Escape"&&(state.open||state.edit)){readOrderFields();state.open=false;state.edit=null;render();}});
})();
</script>
